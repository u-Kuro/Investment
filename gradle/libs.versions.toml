[versions]
agp = "8.7.3"
browser = "1.8.0"
coreSplashscreen = "1.0.1"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.10.1"
constraintlayout = "2.2.1"
okhttp = "4.12.0"
recyclerview = "1.4.0"
swiperefreshlayout = "1.1.0"
